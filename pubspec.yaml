name: aether_project
description: Project Aether — A production-grade Flutter MMO world event system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Firebase
  firebase_core: ^4.9.0
  cloud_firestore: ^6.4.1

  # Dependency Injection
  get_it: ^9.2.1

  # Functional Programming / Error Handling
  dartz: ^0.10.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.1.1

  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
